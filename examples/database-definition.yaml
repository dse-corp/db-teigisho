# yaml-language-server: $schema=../schemas/db-definition.schema.json
format_version: "1.0"

document:
  project_number: PJ-001
  system_name: 受注管理システム
  subsystem_name: 受注API
  created_at: "2026-08-01T09:00:00+09:00"
  updated_at: "2026-08-09T18:30:00+09:00"

database:
  dbms_name: PostgreSQL
  dbms_version: "17.5"
  server_name: db.example.internal
  port: 5432
  database_name: orders
  schema_name: public
  collation: ja_JP.UTF-8

tables:
  - physical_name: customers
    logical_name: 顧客
    description: 顧客の基本情報を管理する。
    columns:
      - physical_name: customer_id
        logical_name: 顧客ID
        data_type: uuid
        default: gen_random_uuid()
        not_null: true
        unique: true
        primary_key: true
        description: 顧客を一意に識別するID。
      - physical_name: email
        logical_name: メールアドレス
        data_type: varchar
        length: 320
        not_null: true
        unique: true
        primary_key: false
    indexes:
      - name: idx_customers_email
        type: btree
        unique: true
        columns:
          - name: email
            order: ASC
        include_columns: []
    foreign_keys: []

  - physical_name: orders
    logical_name: 受注
    description: 顧客から受け付けた受注を管理する。
    columns:
      - physical_name: order_id
        logical_name: 受注ID
        data_type: bigint
        not_null: true
        unique: false
        primary_key: true
      - physical_name: customer_id
        logical_name: 顧客ID
        data_type: uuid
        not_null: true
        unique: false
        primary_key: false
      - physical_name: amount
        logical_name: 合計金額
        data_type: numeric
        length: 18
        scale: 2
        default: 0
        not_null: true
        unique: false
        primary_key: false
    indexes:
      - name: idx_orders_customer
        type: btree
        unique: false
        columns:
          - name: customer_id
            order: ASC
        include_columns:
          - amount
        where: amount > 0
    foreign_keys:
      - name: fk_orders_customers
        columns:
          - customer_id
        referenced_table: customers
        referenced_columns:
          - customer_id
        on_update: NO ACTION
        on_delete: RESTRICT
        deferrable: false

views:
  - physical_name: customer_order_totals
    logical_name: 顧客別受注金額
    description: 顧客単位の受注金額を集計する。
    sql: |
      SELECT
          customer_id,
          SUM(amount) AS total
      FROM orders
      GROUP BY customer_id;

stored_procedures:
  - physical_name: close_orders
    logical_name: 受注締め処理
    description: 対象日までの受注を締める。
    sql: |
      CREATE PROCEDURE close_orders(IN closing_date date)
      LANGUAGE SQL
      AS $$
          SELECT closing_date;
      $$;

