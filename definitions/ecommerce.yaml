        type: btree
        unique: false
        columns:
          - name: customer_id
            order: ASC
    foreign_keys:
      - name: fk_customer_addresses_customers
        columns:
          - customer_id
        referenced_table: customers
        referenced_columns:
          - customer_id
        on_update: CASCADE
        on_delete: CASCADE
        deferrable: false

