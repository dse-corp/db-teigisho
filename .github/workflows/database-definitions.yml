name: Database definitions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install Mermaid renderer
        run: npm ci

      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test with coverage
        run: pytest

      - name: Test interactive ER viewer
        run: npm test

      - name: Check committed JSON Schema
        run: dbdef schema --check schemas/db-definition.schema.json

      - name: Validate example definitions
        run: dbdef validate examples

      - name: Build definition artifacts
        run: dbdef build examples/database-definition.yaml --output dist/database-definition

      - name: Upload definition artifacts
        uses: actions/upload-artifact@v7
        with:
          name: database-definition
          path: dist/database-definition
          if-no-files-found: error
          retention-days: 30
