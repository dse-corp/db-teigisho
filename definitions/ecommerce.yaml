        not_null: true
        unique: false
        primary_key: false
      - physical_name: address_type
        logical_name: 住所種別
        data_type: varchar
        length: 20
        not_null: true
      - physical_name: recipient_name
        logical_name: 宛名
        data_type: varchar
        length: 100
        not_null: true
      - physical_name: postal_code
        logical_name: 郵便番号
        data_type: varchar
        length: 7
        not_null: true
      - physical_name: prefecture
        logical_name: 都道府県
        data_type: varchar
        length: 20
        not_null: true
      - physical_name: city
        logical_name: 市区町村
        data_type: varchar
        length: 100
        not_null: true
      - physical_name: address_line
        logical_name: 住所
        data_type: varchar
        length: 255
        not_null: true
      - physical_name: phone
        logical_name: 電話番号
        data_type: varchar
        length: 30
        not_null: true
