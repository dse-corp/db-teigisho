# yaml-language-server: $schema=../schemas/db-definition.schema.json
format_version: "1.0"

document:
  project_number: PJ-EC-001
  system_name: ECサイト
  subsystem_name: コマース基盤
  created_at: "2026-08-27T09:00:00+09:00"
  updated_at: "2026-08-27T10:00:00+09:00"

database:
  dbms_name: PostgreSQL
  dbms_version: "17.5"
  database_name: ecommerce
  schema_name: public
  collation: ja_JP.UTF-8

tables:
  - physical_name: customers
    logical_name: 顧客
    description: ECサイトを利用する顧客のアカウントとログイン情報を管理する。
    columns:
      - physical_name: customer_id
        logical_name: 顧客ID
        data_type: uuid
        default: gen_random_uuid()
        not_null: true
        unique: true
        primary_key: true
      - physical_name: email
        logical_name: メールアドレス
        data_type: varchar
        length: 320
        not_null: true
        unique: true
      - physical_name: password_hash
        logical_name: パスワードハッシュ
        data_type: varchar
        length: 255
        not_null: true
      - physical_name: display_name
        logical_name: 表示名
        data_type: varchar
        length: 100
        not_null: true
      - physical_name: status
        logical_name: 顧客ステータス
        data_type: varchar
        length: 20
        default: active
        not_null: true
      - physical_name: created_at
        logical_name: 登録日時
        data_type: timestamptz
        default: CURRENT_TIMESTAMP
        not_null: true
      - physical_name: updated_at
        logical_name: 更新日時
        data_type: timestamptz
        default: CURRENT_TIMESTAMP
        not_null: true
    indexes:
      - name: idx_customers_status
        type: btree
        unique: false
        columns:
          - name: status
            order: ASC
    foreign_keys: []

