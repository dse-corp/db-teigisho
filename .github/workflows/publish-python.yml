name: Publish Python package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'

      - name: Run quality checks
        run: |
          ruff check .
          mypy
          pytest
          dbdef schema --check schemas/db-definition.schema.json
          dbdef validate examples
          dbdef build examples/database-definition.yaml --output /tmp/db-teigisho-definition-artifacts

      - name: Build Python distributions
        run: python -m build

      - name: Verify release tag
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(python -c 'from importlib.metadata import version; print(version("db-teigisho"))')"

      - name: Verify wheel installation
        run: |
          python -m venv /tmp/db-teigisho-wheel-test
          /tmp/db-teigisho-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/db-teigisho-wheel-test/bin/dbdef --version
          /tmp/db-teigisho-wheel-test/bin/dbdef validate examples/database-definition.yaml
          /tmp/db-teigisho-wheel-test/bin/dbdef schema --check schemas/db-definition.schema.json

      - name: Upload Python distributions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [build, browser-tests]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/db-teigisho
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v8.0.2
        with:
          name: python-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: dbdef build examples/database-definition.yaml --output dist/browser-test
      - run: npm ci
      - run: npm test
        env:
          DBDEF_GENERATED_HTML: dist/browser-test/database-definition.html
