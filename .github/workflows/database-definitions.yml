name: Database definitions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test with coverage
        run: pytest

      - name: Build Python distributions
        run: python -m build

      - name: Check committed JSON Schema
        run: dbdef schema --check schemas/db-definition.schema.json

      - name: Validate example definitions
        run: dbdef validate examples

      - name: Build definition artifacts
        run: dbdef build examples/database-definition.yaml --output dist/database-definition

      - name: Upload definition artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: database-definition
          path: dist/database-definition
          if-no-files-found: error
          retention-days: 30

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: dbdef build examples/database-definition.yaml --output dist/browser-test
      - run: npm ci
      - run: npm test
        env:
          DBDEF_GENERATED_HTML: dist/browser-test/database-definition.html
