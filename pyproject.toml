[build-system]
requires = ["hatchling>=1.33.0,<2"]
build-backend = "hatchling.build"

[project]
name = "db-teigisho"
version = "0.2.2"
description = "YAML-first database definition validation and publishing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dse-corp" }]
keywords = ["database", "database-definition", "yaml", "schema", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
  "Jinja2>=3.1.6,<4",
  "openpyxl>=3.1.5,<4",
  "Pillow>=13.0.0,<14",
  "pydantic>=2.14.2,<3",
  "PyYAML>=6.0.3,<7",
  "reportlab>=5.1.0,<6",
]

[project.urls]
Homepage = "https://github.com/dse-corp/db-teigisho"
Repository = "https://github.com/dse-corp/db-teigisho"
Issues = "https://github.com/dse-corp/db-teigisho/issues"

[project.optional-dependencies]
dev = [
  "build>=1.6.1,<2",
  "mypy>=2.4.1,<3",
  "pytest>=9.2.0,<10",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.17.3,<1",
  "types-openpyxl>=3.1.5.20261017,<4",
  "types-PyYAML>=6.0.12.20261030,<7",
  "types-reportlab>=5.0.0.20261008,<6",
]

[project.scripts]
dbdef = "db_teigisho.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/db_teigisho"]

[tool.hatch.build.targets.sdist]
include = ["src/db_teigisho", "README.md", "schemas", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=db_teigisho --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["db_teigisho"]
